<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#fafaf9" />
    <meta name="referrer" content="no-referrer" />
    <title>Offline · Digital Closet</title>
    <style>
      body {
        margin: 0;
        background: #fafaf9;
        color: #242424;
        font:
          17px/1.6 system-ui,
          sans-serif;
      }
      main {
        max-width: 28rem;
        margin: 18vh auto;
        padding: 24px;
      }
      h1 {
        font-size: 2rem;
        line-height: 1.2;
      }
      p {
        color: #62625f;
      }
      a {
        display: inline-block;
        padding: 12px 24px;
        background: #242424;
        color: #fafaf9;
        border-radius: 12px;
        text-decoration: none;
      }
      a:focus-visible {
        outline: 3px solid #62625f;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p>Digital Closet</p>
      <h1>You’re offline.</h1>
      <p>
        Reconnect to open your wardrobe or a shared closet. Your saved pieces
        will be there when you return.
      </p>
      <a href="/">Try again</a>
    </main>
  </body>
</html>
